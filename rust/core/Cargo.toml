[package]
name = "kirc-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Pure-Rust IRCv3 protocol engine for kIRC (no Qt / cxx dependencies)"
repository = "https://example.invalid/kIRC"
publish = false

# Library target only. No cdylib / staticlib: the Qt bridge is a separate crate
# that depends on this one as a plain Rust dependency.
[lib]
name = "kirc_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
log = "0.4"

[dev-dependencies]
# `test-util` (not part of `full`) provides the paused clock used by the
# connectivity tests: `tokio::time::pause` / `advance` drive the registration,
# TLS-handshake and keepalive deadlines without waiting them out in real time.
tokio = { version = "1", features = ["full", "test-util"] }
