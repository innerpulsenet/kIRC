<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  kIRC application icon.

  SPDX-License-Identifier: GPL-2.0-or-later

  A terminal window, not a speech bubble: the client is an IRC console, so the
  mark is a dark terminal tile with a title rule and a bold "#" channel glyph in
  the palette of the default `tui` theme (bgPanel #101417, rule #2b3238, accent
  #4cc9dd). Everything is drawn as geometry — no text element — so it
  rasterises identically with rsvg, Inkscape or Qt without needing a font, and
  the thick strokes survive down to 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256" version="1.1">
  <!-- Terminal tile -->
  <rect x="8" y="8" width="240" height="240" rx="44" ry="44"
        fill="#101417" stroke="#2b3238" stroke-width="4"/>

  <!-- Window controls in the title band -->
  <g fill="#4a565f">
    <circle cx="42" cy="38" r="6"/>
    <circle cx="64" cy="38" r="6"/>
    <circle cx="86" cy="38" r="6"/>
  </g>

  <!-- Title rule, inset so it never crosses the rounded corners -->
  <line x1="30" y1="62" x2="226" y2="62"
        stroke="#2b3238" stroke-width="4" stroke-linecap="round"/>

  <!-- "#" channel glyph, drawn as strokes so no font is required -->
  <g stroke="#4cc9dd" stroke-width="22" stroke-linecap="round">
    <line x1="108" y1="117" x2="108" y2="193"/>
    <line x1="148" y1="117" x2="148" y2="193"/>
    <line x1="90" y1="133" x2="166" y2="133"/>
    <line x1="90" y1="177" x2="166" y2="177"/>
  </g>
</svg>
