<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  kIRC application icon — small-size variant (16/22/24px).

  SPDX-License-Identifier: GPL-2.0-or-later

  Hand-tuned for the sizes where the main icon turns to mush: the tile radius
  is reduced and the "#" is drawn larger with SQUARE caps (round caps merge the
  strokes into a blob at 16px).  Like the main icon the glyph is centred on the
  tile: with stroke-width 30 the outer box is 59..197 on both axes, symmetric
  about the tile centre 128,128.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256" version="1.1">
  <rect x="6" y="6" width="244" height="244" rx="34" ry="34"
        fill="#101417" stroke="#39434b" stroke-width="8"/>

  <g stroke="#4cc9dd" stroke-width="30">
    <line x1="104" y1="84" x2="104" y2="172"/>
    <line x1="152" y1="84" x2="152" y2="172"/>
    <line x1="74" y1="106" x2="182" y2="106"/>
    <line x1="74" y1="150" x2="182" y2="150"/>
  </g>
</svg>
