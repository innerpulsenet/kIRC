<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  kIRC application icon — small-size variant (16/22/24px).

  SPDX-License-Identifier: GPL-2.0-or-later

  Hand-tuned for the sizes where the main icon turns to mush: the window dots
  and title rule are dropped (they only smear the top edge), the tile radius is
  reduced, and the "#" is drawn larger with square caps so its strokes stay
  separate instead of merging into a blob at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256" version="1.1">
  <rect x="6" y="6" width="244" height="244" rx="34" ry="34"
        fill="#101417" stroke="#39434b" stroke-width="8"/>

  <g stroke="#4cc9dd" stroke-width="30">
    <line x1="104" y1="88" x2="104" y2="200"/>
    <line x1="152" y1="88" x2="152" y2="200"/>
    <line x1="74" y1="122" x2="182" y2="122"/>
    <line x1="74" y1="166" x2="182" y2="166"/>
  </g>
</svg>
