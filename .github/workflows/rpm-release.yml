# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Build the Fedora RPM and the Windows x64 package for every release tag, and
# publish them together as one GitHub Release.
#
#   git tag v0.7.0 && git push origin v0.7.0
#
# The tag is the single source of truth: the leading "v" is stripped and the
# result becomes the RPM version, the AppStream release, the crate versions and
# the version the application reports.  The spec lives in packaging/ and builds
# fully offline (vendored crates + vendored cxx-qt-cmake), exactly as Koji/COPR
# require — this workflow regenerates those vendored inputs from the tag.
#
# Tags may be v0.7 or v0.7.0 or v0.7.1; only the numeric form matters.
#
# The Windows half is .github/workflows/windows-ci.yml — the same workflow that
# gates branches and pull requests — called here with the resolved version, so
# a release ships exactly what CI builds.  One publish job uploads both
# platforms' assets, so the two builds never race to create the release, and a
# failed Windows build blocks the release instead of quietly shipping without
# it.  A workflow_dispatch run builds everything and publishes nothing, which
# is the way to rehearse a release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.7.0)'
        required: true
        type: string

# Only the publish job creates the Release; everything else is read-only.
permissions:
  contents: read

env:
  # Must match CMakeLists.txt's FetchContent GIT_TAG and the spec's Source1 /
  # %global cxxqt_dir.
  CXXQT_VERSION: '0.10.0'
  # Pinned to the GIT_TAG cxx-qt-cmake 0.10.0 requests for corrosion.
  CORROSION_VERSION: '0.5.2'

jobs:
  version:
    name: Resolve the release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve the version from the tag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "::error::expected a v* tag, got '$tag'"; exit 1 ;;
          esac
          version="${tag#v}"
          # Cargo requires exactly three components (major.minor.patch), so a
          # v0.8 tag has to become 0.8.0: stamping `version = "0.8"` into the
          # crate manifests makes `cargo vendor` fail with "unexpected end of
          # input while parsing minor version number". Normalise once, here, so
          # the source tarball name, the spec's Version, the AppStream release,
          # the manifests and the Windows assets cannot disagree about the
          # version.
          if ! [[ "$version" =~ ^([0-9]+)(\.([0-9]+))?(\.([0-9]+))?$ ]]; then
            echo "::error::tag '$tag' does not yield a major[.minor[.patch]] version (e.g. v0.8 or v0.8.1)"; exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[3]:-0}.${BASH_REMATCH[5]:-0}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::building kIRC $version from $tag"

  engine-tests:
    name: Protocol engine tests
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            cargo rust gcc gcc-c++ perl

      - name: cargo test
        run: cargo test --manifest-path rust/core/Cargo.toml

  rpm:
    name: Build RPM
    needs: [version, engine-tests]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            rpm-build rpmdevtools \
            cmake gcc-c++ cargo rust \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami-devel kf6-kconfig-devel kf6-knotifications-devel \
            kf6-kstatusnotifieritem-devel kf6-kwallet-devel \
            desktop-file-utils libappstream-glib curl tar gzip rsync
          rpmdev-setuptree

      - name: Stamp the tree with the release version
        run: packaging/set-version.sh "${{ needs.version.outputs.version }}"

      - name: Generate the vendored source archives
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.version.outputs.version }}"
          sources="$HOME/rpmbuild/SOURCES"

          # Source2 — `cargo vendor` output with a top-level vendor/ directory,
          # which %setup -a 2 unpacks to the path the spec's cargo config uses.
          # This runs BEFORE the tree tarball on purpose: stamping the version
          # rewrites the crate manifests, and `cargo vendor` is what brings
          # rust/Cargo.lock back in step, so Source0 ships a consistent pair.
          ( cd rust && cargo vendor vendor >/dev/null )
          tar czf "$sources/kirc-vendor-$ver.tar.gz" -C rust vendor

          # Source0 — the tree under one kirc-<version>/ directory, staged with
          # rsync rather than `tar --exclude`.  GNU tar matches its excludes
          # against the archive name, and archiving "." stores names as
          # "./rust/target/...", so `--exclude=rust/target` silently excludes
          # nothing: a 365 MB tree of test binaries and a leaked cargo vendor
          # directory went into the SRPM that way.  rsync's patterns match path
          # components at any depth, which is what is actually wanted here.
          stage="$(mktemp -d)"
          mkdir -p "$stage/kirc-$ver"
          rsync -a \
            --exclude='.git/' --exclude='build/' --exclude='target/' \
            --exclude='vendor/' --exclude='.hermes/' --exclude='*.tar.gz' \
            ./ "$stage/kirc-$ver/"
          tar czf "$sources/kirc-$ver.tar.gz" -C "$stage" "kirc-$ver"
          rm -rf "$stage"

          # Source1 — cxx-qt-cmake, matching CMakeLists.txt's FetchContent tag.
          curl -fsSL -o "$sources/cxx-qt-cmake-$CXXQT_VERSION.tar.gz" \
            "https://github.com/kdab/cxx-qt-cmake/archive/refs/tags/$CXXQT_VERSION.tar.gz"

          # Source3 — corrosion. cxx-qt-cmake's own CMake FetchContent's it at
          # configure time; left to itself that is a git clone from GitHub, so
          # the build needs git and the network and fails without either
          # ("could not find git for clone of corrosion-populate"). Shipping it
          # keeps the build offline, the same way Source1 does for cxx-qt-cmake.
          curl -fsSL -o "$sources/corrosion-$CORROSION_VERSION.tar.gz" \
            "https://github.com/corrosion-rs/corrosion/archive/refs/tags/v$CORROSION_VERSION.tar.gz"

          cp packaging/kirc.spec "$HOME/rpmbuild/SPECS/"
          ls -la "$sources"
          echo "::notice::Source0 is $(du -h "$sources/kirc-$ver.tar.gz" | cut -f1)"

      - name: rpmbuild
        run: rpmbuild -ba "$HOME/rpmbuild/SPECS/kirc.spec"

      - name: Collect the packages into the workspace
        shell: bash
        run: |
          # rpmbuild writes to $HOME, which lives inside the container and is
          # NOT visible to the host-side actions below — the workspace is.
          set -euo pipefail
          mkdir -p dist
          find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name '*.rpm' -exec cp -v {} dist/ \;
          ls -la dist

      - name: Verify the RPM metadata
        shell: bash
        run: |
          set -euo pipefail
          rpm -qp --queryformat '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' dist/*.rpm
          # The payload must contain the launcher, and the icon must resolve.
          # Note: listing to a file rather than piping into `grep -q`, whose
          # early exit would SIGPIPE `rpm` and fail the step under pipefail.
          listing="$(mktemp)"
          rpm -qlp dist/kirc-"${{ needs.version.outputs.version }}"-*.x86_64.rpm > "$listing"
          for path in /usr/bin/kIRC \
                      /usr/share/icons/hicolor/scalable/apps/kirc.svg \
                      /usr/share/applications/kIRC.desktop \
                      /usr/share/knotifications6/kIRC.notifyrc; do
            grep -qx "$path" "$listing" || { echo "::error::$path missing from the RPM"; exit 1; }
          done
          echo "::notice::payload verified"

      - uses: actions/upload-artifact@v4
        with:
          name: kirc-rpm-${{ needs.version.outputs.version }}
          path: dist/*.rpm
          if-no-files-found: error

  windows:
    name: Build Windows package
    needs: version
    # The branch/PR Windows workflow, called with the release version: it
    # stamps the tree, builds, runs the suites and stages version-named
    # assets. Keeping one workflow means a release cannot silently diverge
    # from what CI proves on every push.
    uses: ./.github/workflows/windows-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish the release
    needs: [version, rpm, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the RPM assets
        uses: actions/download-artifact@v4
        with:
          name: kirc-rpm-${{ needs.version.outputs.version }}
          path: dist

      - name: Collect the Windows assets
        uses: actions/download-artifact@v4
        with:
          name: kIRC-windows-x64
          path: dist

      - name: Inventory the release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          # Both platforms must be present: publishing half a release is worse
          # than failing, because the missing half looks deliberate.
          for pattern in 'kirc-*.x86_64.rpm' 'kirc-*.src.rpm' \
                         "kIRC-${{ needs.version.outputs.version }}-windows-x64.zip" \
                         "kIRC-${{ needs.version.outputs.version }}-setup-x64.exe"; do
            compgen -G "dist/$pattern" > /dev/null || { echo "::error::no release asset matches $pattern"; exit 1; }
          done
          # The sums name their files without a directory, so check from there.
          ( cd dist && sha256sum -c ./*.sha256 )
          echo "::notice::release assets verified"

      # Only the upload is tag-gated: a workflow_dispatch run still collects
      # and verifies the assets above, so a release can be rehearsed in full
      # without creating one.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: kIRC ${{ needs.version.outputs.version }}

      - name: Report a rehearsal
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "::notice::assets verified; nothing published because ${{ github.ref }} is not a tag"
