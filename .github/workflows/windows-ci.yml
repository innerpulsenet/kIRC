name: Windows CI

on:
  push:
    branches: [main, codex/windows-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      KIRC_CRAFT_ROOT: C:\CraftRoot
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/core/target
            C:\CraftRoot\download\cache
          key: windows-downloads-qt611-kf630-${{ hashFiles('rust/Cargo.lock', 'rust/core/Cargo.lock') }}

      - name: Bootstrap KDE Craft and dependencies
        shell: pwsh
        run: |
          # GitHub's Windows image exposes Git's MSYS tools and a separate MinGW
          # toolchain globally. Craft must bootstrap against MSVC and its own MSYS.
          $blockedPaths = @('C:\Program Files\Git\bin', 'C:\mingw64\bin')
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $entry = $_.TrimEnd('\')
            $entry -notin $blockedPaths
          }) -join ';'
          if (-not (Test-Path "$env:KIRC_CRAFT_ROOT\craft\bin\craft.py")) {
            Invoke-WebRequest https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -OutFile "$env:RUNNER_TEMP\CraftBootstrap.py"
            python "$env:RUNNER_TEMP\CraftBootstrap.py" --prefix $env:KIRC_CRAFT_ROOT --branch master --use-defaults
            python "$env:KIRC_CRAFT_ROOT\craft\bin\craft.py" --unshelve "$env:KIRC_CRAFT_ROOT\etc\bootstrap.shelf"
          }
          python "$env:KIRC_CRAFT_ROOT\craft\bin\craft.py" libs/qt6/qtbase libs/qt6/qtdeclarative libs/qt6/qtsvg kirigami kconfig extra-cmake-modules dev-utils/nsis

      - name: Protocol engine tests
        run: cargo test --locked --manifest-path rust/core/Cargo.toml

      - name: Native application build and CTest
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Theme contract
        run: python qml-tests/check-theme-tokens.py

      - name: QML UI contracts
        shell: pwsh
        run: python qml-tests/run.py --qml-bin "$env:KIRC_CRAFT_ROOT\bin\qml.exe"

      - name: Stage ZIP and installer
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          ./packaging/windows/stage.ps1 -VCRedistRoot "$vs\VC\Redist\MSVC" -Archive
          ./packaging/windows/make-installer.ps1 -Makensis "$env:KIRC_CRAFT_ROOT\dev-utils\bin\makensis.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: kIRC-windows-x64
          path: |
            stage/kIRC-windows-x64.zip
            stage/kIRC-windows-x64.zip.sha256
            stage/kIRC-setup-x64.exe
            stage/kIRC-setup-x64.exe.sha256
