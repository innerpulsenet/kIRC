# SPDX-License-Identifier: MIT OR Apache-2.0
name: Windows CI

on:
  push:
    branches: [main, codex/windows-port]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this with the tag's version: that run stamps the
  # version into the tree first and emits version-named release assets.
  workflow_call:
    inputs:
      version:
        description: Release version (major.minor.patch); empty for a plain CI build
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Release runs get their own group so an unrelated branch push cannot cancel
  # a build whose artifacts are about to be published.
  group: windows-ci-${{ github.ref }}${{ inputs.version && '-release' || '' }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      KIRC_CRAFT_ROOT: C:\CraftRoot
      CARGO_TERM_COLOR: always
      KIRC_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/core/target
            C:\CraftRoot\download\cache
          key: windows-downloads-qt611-kf630-${{ hashFiles('rust/Cargo.lock', 'rust/core/Cargo.lock') }}

      - name: Stamp the release version
        if: inputs.version != ''
        shell: pwsh
        run: |
          python packaging/set-version.py $env:KIRC_RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "set-version.py failed with exit code $LASTEXITCODE" }

      - name: Bootstrap KDE Craft and dependencies
        shell: pwsh
        timeout-minutes: 60
        run: |
          # CraftBootstrap calls any host that exports ANDROID_SDK_ROOT *and*
          # ANDROID_NDK an Android host, and then pins BuildType=MinSizeRel --
          # a build type KDE publishes no Windows binary cache for. Every
          # package, Qt included, would be compiled from source and the job
          # would time out. GitHub's Windows images export both variables.
          $android = @(Get-ChildItem Env: | Where-Object { $_.Name -like 'ANDROID_*' })
          foreach ($variable in $android) {
            Write-Host "Unsetting $($variable.Name) so Craft bootstraps as a Windows host"
            Remove-Item -LiteralPath "Env:$($variable.Name)"
          }
          # Craft refuses a PATH carrying a foreign sh/gcc/make: the image has
          # Git's MSYS tools, a MinGW toolchain and Strawberry Perl's gcc.
          $blockedPaths = @('C:\Program Files\Git\bin', 'C:\Program Files\Git\usr\bin',
                            'C:\mingw64\bin', 'C:\Strawberry\c\bin')
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $entry = $_.TrimEnd('\')
            $entry -notin $blockedPaths
          }) -join ';'
          if (-not (Test-Path "$env:KIRC_CRAFT_ROOT\craft\bin\craft.py")) {
            Invoke-WebRequest https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -OutFile "$env:RUNNER_TEMP\CraftBootstrap.py"
            try {
              python "$env:RUNNER_TEMP\CraftBootstrap.py" --prefix $env:KIRC_CRAFT_ROOT --branch master --use-defaults
            } catch {
              Write-Host "CraftBootstrap.py reported: $_"
            }
            $bootstrap = $LASTEXITCODE
            if (-not (Test-Path "$env:KIRC_CRAFT_ROOT\craft\bin\craft.py")) {
              throw "CraftBootstrap.py failed with exit code $bootstrap"
            }
            if ($bootstrap -ne 0) {
              # Craft installed; only its optional shelf (start-menu entry,
              # snoretoast, coloredlogs) failed. None of those are build inputs.
              Write-Host "::warning::CraftBootstrap.py exited $bootstrap after installing Craft; continuing"
            }
          }
          # Silent cache misses are the failure mode that matters here, so
          # assert the build type the KDE Windows cache actually publishes
          # before spending the job on package installs.
          $setting = Select-String -LiteralPath "$env:KIRC_CRAFT_ROOT\etc\CraftSettings.ini" `
            -Pattern '^\s*BuildType\s*=\s*(\S+)' | Select-Object -First 1
          if (-not $setting) { throw "No BuildType in $env:KIRC_CRAFT_ROOT\etc\CraftSettings.ini" }
          $buildType = $setting.Matches[0].Groups[1].Value
          Write-Host "Craft BuildType: $buildType"
          if ($buildType -ne 'RelWithDebInfo') {
            throw "Craft BuildType is '$buildType'; the Windows binary cache only publishes RelWithDebInfo"
          }
          python "$env:KIRC_CRAFT_ROOT\craft\bin\craft.py" libs/qt6/qtbase libs/qt6/qtdeclarative libs/qt6/qtsvg kirigami kconfig extra-cmake-modules dev-utils/nsis
          if ($LASTEXITCODE -ne 0) { throw "craft.py failed with exit code $LASTEXITCODE" }

      - name: Protocol engine tests
        run: cargo test --locked --manifest-path rust/core/Cargo.toml

      - name: Native application build and CTest
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Theme contract
        run: python qml-tests/check-theme-tokens.py

      - name: QML UI contracts
        shell: pwsh
        run: python qml-tests/run.py --qml-bin "$env:KIRC_CRAFT_ROOT\bin\qml.exe"

      - name: Stage ZIP and installer
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          # Release assets carry the version; CI builds keep the plain names so
          # a branch artifact is never mistaken for a release download.
          $zipName = 'kIRC-windows-x64.zip'
          $installer = 'stage/kIRC-setup-x64.exe'
          if ($env:KIRC_RELEASE_VERSION) {
            $zipName = "kIRC-$env:KIRC_RELEASE_VERSION-windows-x64.zip"
            $installer = "stage/kIRC-$env:KIRC_RELEASE_VERSION-setup-x64.exe"
          }
          ./packaging/windows/stage.ps1 -VCRedistRoot "$vs\VC\Redist\MSVC" -Archive -ArchiveName $zipName
          ./packaging/windows/make-installer.ps1 -Makensis "$env:KIRC_CRAFT_ROOT\dev-utils\bin\makensis.exe" -Output $installer

      - uses: actions/upload-artifact@v4
        with:
          name: kIRC-windows-x64
          path: |
            stage/*.zip
            stage/*.zip.sha256
            stage/*.exe
            stage/*.exe.sha256
          if-no-files-found: error
